# Event-card header photographs: real archival photos, never AI images (docs/event-images.md).
# This file maps event ids to pictures for the Unity card only. It is NOT game content: content/events/*.yaml feed the
# content hash and save compatibility, and this file must never move there.
# Each row: the event id, the shipped file (in this folder), the Commons file page and original (with its SHA-1), the
# licence (ALLOWED_LICENCES spelling), the artist, the credit line shown under the picture (for CC BY 4.0, the credit
# line the licensor asks for on Commons, plus the licence and the adaptation), the alt text, the crop (centre x, centre y
# and width, as shares of the original; the height follows from the 9:4 header) and the sensitivity flags.
# sensitive: true rows may not ship in a -shareable build until sensitivity_reviewed: true (an OWNER step; Build.cs).
# Owner rulings 2026-10-11: CC BY 4.0 event photos allowed with a credit line; shown in black and white with a subtle
# warm sepia/navy grade and the gold frame; no colourising, no change beyond grade, crop and resize.
# tools/event_images.py makes the JPGs from the originals; EventImageImport rebuilds EventImageCatalog.asset from this file.
# Events with no row (rhodes_talks, armistice_lebanon, armistice_syria, education_registration_1951, reparations_claim,
# forex_crisis_1951) fall back to the minister's portrait plate.
checked: 2026-10-11
