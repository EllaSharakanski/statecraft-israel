# A player who puts the city's people to work first (GDD Phase 1 PR 3): on the first turn it fills Tel Aviv's 90 jobs, then
# plays on with no other order; events nobody answered are delegated. It plays the real content (the GDD loop since the
# cutover), so it moves whenever a GDD rule or design value it reaches changes.
name: mvp-absorb-first
until: 1949-06-15
steps:
  - on: 1948-05-15
    commands:
      - { kind: assign_workers, city: tel_aviv, role: job, count: 90 }
