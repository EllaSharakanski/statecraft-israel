# A reckless player: full rationing from the first turn, refuses the First Truce, and mobilises everyone.
name: reckless
until: 1949-01-01
steps:
  - on: 1948-05-15
    commands:
      - { kind: set_policy, policy: rationing, level: 1.0 }
      - { kind: set_mobilization, level: 1.0 }
  - on: 1948-06-01
    commands:
      - { kind: choose_event_option, event: first_truce, option: refuse }
