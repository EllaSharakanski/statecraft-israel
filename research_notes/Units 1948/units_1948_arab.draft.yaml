# DRAFT: the Arab forces of 1948-49 as map tokens, for the owner's ruling of 2026-10-11 (research only; nothing reads
# this file yet). Research note: research_notes/Units 1948/arab-armies-1948.md.
#
# Schema: the same as content/map/units_1948.yaml on branch units-in-play (see that file's header for anchors, `since`,
# `precision`, `end_basis`, `front`, `hidden`, `wikipedia_only`, `status`), plus:
#   side: arab (every row here).
#   army: egypt | transjordan | iraq | syria | lebanon | ala | palestinian_local. The `armies` block below gives each
#     army's proposed colour, badge and sourced appearance.
#   echelon: brigade | brigade_group | regiment | battalion | force. Rows below brigade are shown as the formations they
#     were, at a brigade token's size (ruling 3).
#   commanders: only where a source names them; card text stays military (name, place, date).
#   to_verify: a claim the snippet supports only in part; the row is a draft until the printed page is checked.
#   conflicts: where the sources disagree; the row keeps one value and says which.
#   sources: each {url, checked}; book pages add `cite`. A books.google.com URL is a Google Books search-inside snippet
#     of the printed page, read on the check date (not the full page).
# Fronts for end_basis front_armistice: egypt 1949-02-24, lebanon 1949-03-23, jordan 1949-04-03, syria 1949-07-20
#   (https://en.wikipedia.org/wiki/1949_Armistice_Agreements, checked 2026-10-11). The Iraqi sector ends on the jordan
#   date: Iraq signed no armistice; the Israel-Jordan agreement covered the Iraqi-held front (Morris 2008, p. 388).
# Coordinates: the place's Wikipedia article (API prop=coordinates), Hebrew Wikipedia or Wikidata where noted.
# Short cites: Tal = David Tal, War in Palestine, 1948: Israeli and Arab Strategy and Diplomacy (Routledge, 2004),
#   Google Books Vs2PAgAAQBAJ. Morris = Benny Morris, 1948: A History of the First Arab-Israeli War (Yale, 2008),
#   Google Books CC7381HrLqcC.

# Rulings, 2026-10-11 (owner 1-3; controller 4-9, owner-delegated). Research note, "Rulings".
#   1. The category label is "Local Arab forces"; each force keeps the name it used ("Army of the Holy War").
#   2. al-Malikiyya, 15 May: the newer research (the ALA); the Lebanese 3rd Battalion from 6 June. The card notes
#      Lorch's account (`card_note`).
#   3. Rows below brigade are shown as the formations they were, at the same token size as a brigade.
#   4. Every Arab token has a constant 3 figures (`figures`).
#   5. Faluja ends on the Egyptian armistice (24 February 1949); the row notes the evacuation on 26-27 February.
#   6. A window that opens on a source's later description is accepted; the source's date is the opening.
#   7. The Holy War, Nazareth row is hidden until a published source is found.
#   8. The ALA's emblem (a dagger stabbing a Star of David) is never used; the neutral badge is. The Legion's shemagh
#      colour stays unsourced (the 1948 photographs are black and white): it is rendered neutral.
#   9. Placement follows the Israeli units' rule: at most one hex from the anchor, never on ground the other side
#      held; where front data is missing, the token is offset within the anchor hex.
figures: 3

armies:
  egypt:
    label: Egyptian Army (Egyptian Expeditionary Force)
    colour: {hex: '#1E6B3A', basis: "The green field of the Kingdom of Egypt's flag (en.wiki Flag of Egypt: a white crescent and three white stars on green, adopted under King Fuad and kept until 1958)."}
    badge: {glyph: crescent_three_stars, basis: "The same flag's white crescent and three stars."}
    appearance: "British-pattern khaki; in the Faluja pocket, 1948: battledress, peaked caps, berets and side caps, Brodie steel helmets (the photographs listed). Officers' tarboosh is not attested in a 1948 field photo here: not drawn."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Flag_of_Egypt', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Nasser_at_Faluja_Palestine.png', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Taha_and_Rabin.jpg', checked: '2026-10-11'}
  transjordan:
    label: Arab Legion (Transjordan)
    colour: {hex: '#A3242B', basis: "The red chevron of the Transjordan flag (adopted 16 April 1928; en.wiki Flag of Jordan)."}
    badge: {glyph: seven_pointed_star, basis: "The white seven-pointed star in the flag's red triangle."}
    appearance: "Checked shemagh with black agal, the cap badge worn on the agal; khaki shirts and trousers, leather bandoliers (photos: near Ramallah, 20 July 1948; Old City walls, 1948). Red-and-white colour: en.wiki Keffiyeh ties the red-and-white shemagh to Jordan and to Glubb's Jordanian troops; the 1948 photographs are black and white, so the colour in 1948 is from that article only. Ruling 8: the shemagh is rendered in a neutral colour until a period source is found."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Flag_of_Jordan', checked: '2026-10-11'}
    - {url: 'https://en.wikipedia.org/wiki/Keffiyeh', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:John_Bagot_Glubb_and_soldiers_in_Ramallah_July_20_1948.webp', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Arab_Legion_Platoon_on_the_walls_of_Old_Jerusalem_(1948).jpg', checked: '2026-10-11'}
  iraq:
    label: Iraqi Army (expeditionary force)
    colour: {hex: '#2B2B2B', basis: "The black band of the Kingdom of Iraq's flag (black-white-green with a red trapezoid and two white seven-pointed stars; en.wiki Flag of Iraq)."}
    badge: {glyph: two_seven_pointed_stars, basis: "The two stars of the same flag."}
    appearance: "Khaki drill shirts and shorts, the sidara (Faisaliyya) side cap, puttees; Humber armoured car (photo at Jenin, 1948; its provenance is weak: an uploader's public-domain claim)."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Flag_of_Iraq', checked: '2026-10-11'}
    - {url: 'https://en.wikipedia.org/wiki/Sidara', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Iraqi_army_in_jeneen_palestine_1948.jpg', checked: '2026-10-11'}
  syria:
    label: Syrian Army
    colour: {hex: '#5A6B7A', basis: "Slate, chosen to be distinct (the 1946-58 flag is green-white-black with three red stars, en.wiki Flag of Syria; its green and black are taken by Egypt and Iraq)."}
    badge: {glyph: three_stars, basis: "The three red stars of the 1946-58 flag."}
    appearance: "Not sourced to a 1948 photograph here. French-built R 35 and R 37 tanks (en.wiki 1948 Arab-Israeli War); the Degania A photograph shows a captured tank with an Arabic hull number. Figures use a neutral khaki default until a source is found."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Flag_of_Syria', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Degania_A.jpg', checked: '2026-10-11'}
  lebanon:
    label: Lebanese Army
    colour: {hex: '#C8C8C0', basis: "The white band of the 1943 flag (red-white-red with a green cedar; en.wiki Flag of Lebanon)."}
    badge: {glyph: cedar, basis: "The flag's cedar."}
    appearance: "Not sourced to a 1948 photograph here; neutral khaki default."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Flag_of_Lebanon', checked: '2026-10-11'}
  ala:
    label: Arab Liberation Army
    colour: {hex: '#B08D57', basis: "Sand, chosen to be distinct; the army had no national flag."}
    badge: {glyph: neutral_crossed_rifles, basis: "Ruling 8: never the ALA's own emblem. SENSITIVE: that emblem was a dagger stabbing a Star of David (Commons, the captured armoured car and the 1948 al-Musawwar page). It is not to be drawn; a neutral glyph is proposed (research note, Sensitivity 1)."}
    appearance: "Keffiyeh with agal, khaki shirts and trousers, ammunition bandoliers, slung rifles (photo: ALA on parade, 1948)."
    sources:
    - {url: 'https://commons.wikimedia.org/wiki/File:ALA_i.jpg', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Qawuqjis_armored_vehicle.jpg', checked: '2026-10-11'}
    - {url: 'https://commons.wikimedia.org/wiki/File:Arab_Liberation_Army.svg', checked: '2026-10-11'}
  palestinian_local:
    label: Local Arab forces
    colour: {hex: '#7A6A58', basis: "Stone brown, chosen to be distinct; no flag or emblem is sourced for the force."}
    badge: {glyph: neutral_rifle, basis: "No sourced emblem; a neutral glyph."}
    appearance: "Mixed: civilian dress with keffiyeh and agal, some in khaki or battledress, a Brodie steel helmet; STEN and Thompson guns (photo: Holy War Army fighters, Jerusalem, 1948, from before the game's window)."
    sources:
    - {url: 'https://commons.wikimedia.org/wiki/File:Arab_fighters_of_the_Holy_War_Army_in_Jerusalem_1948.jpg', checked: '2026-10-11'}

