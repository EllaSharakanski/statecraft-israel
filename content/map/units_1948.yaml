# The military formations the map draws in 1948-49 (docs/units.md, "Units in play"). Map-only: the sim never reads this
# file (ContentLoader reads only its own files), so it does not move the content hash or the goldens. The map reads it
# (UnitRoster) together with the sim's security level and reserve call-up, and draws one token per unit.
#
# Owner rulings (2026-10-11): one token per brigade; the number of figures follows the call-up (1, 2 or 3); an Avia
# S-199 until the Spitfire's sourced date, then the Spitfire; brigades with no sourced position are listed but hidden;
# tokens stand only at dated, sourced positions and do not move with operation events; after the armistices only what a
# source says continued is shown; no orders (the unit panel links to the Defence screen).
#
# anchors: where the unit stood, each a named place a source gives for a dated window. The map draws the unit while the
#   game date is inside one of its windows: from (inclusive) to `to` (exclusive), 'YYYY-MM-DD', quoted. precision:
#   month marks a window edge that the source gives only as a month (the first of the month is used). A 1948 sector
#   with no stated end runs to 20 July 1949, the last of the armistice agreements (Israel–Syria, signed 20 July 1949:
#   https://en.wikipedia.org/wiki/1949_Armistice_Agreements, checked 2026-10-11): after that a unit shows only where a
#   source gives a later position, and none does yet.
# The token stands on the nearest hex to its anchor that is clear of the settlement kits and the railways and roads
#   (UnitPlacer, at most UnitPlacer.MaxShift hexes away): a presentation offset, not a claim about the position.
# Coordinates: the place's Wikipedia article (Wikipedia API prop=coordinates), or Wikidata (CC0) where it has none.
# wikipedia_only: true when every source of the row is a Wikipedia article (English or Hebrew) or a Wikidata item (for
#   coordinates only); such a row is a draft
#   until checked against a published history (Netanel Lorch, The Edge of the Sword, 1961) or the IDF and Defense
#   Establishment Archives.
# hidden: a unit the sources name but do not place; the map does not draw it (owner ruling, 2026-10-11).
# status: draft = sourced and checked against the cited text, not yet by a historian.
units:
