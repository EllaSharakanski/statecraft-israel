# --- Air: the first fighter squadron ---------------------------------------------------------------------------------
- id: squadron_101
  name: 101 Squadron
  number: First Fighter Squadron
  service: air
  formed: 20 May 1948
  first_commander: Modi Alon
  sector: "Formed at Ekron (the former RAF Aqir) on 20 May 1948; first mission 29 May. From the end of May to October 1948 it flew from a strip near Herzliya, then from Hatzor."
  wikipedia_only: false
  status: draft
  aircraft:
  - type: avia-s199
    from: '1948-05-20'
    to: '1948-10-21'
    markings_from: '1948-10-15'
    note: "The first four arrived on 20 May 1948 (Avia S-199). For Operation Ten Plagues (Yoav, 15-22 October 1948) the squadron's fighters got red spinners, red and white rudder stripes and Star of David roundels atop the wings (Eduard Info 11/2025, p. 53). The Avias were mostly withheld by the end of October."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Avia_S-199', checked: '2026-10-11'}
    - {url: 'https://info.eduard.com/en/11-2025-1/strana-53', checked: '2026-10-11'}
    - {url: 'https://info.eduard.com/en/11-2025-1/strana-54', checked: '2026-10-11'}
  - type: spitfire
    from: '1948-10-21'
    note: "On 21 October 1948 IAF Spitfires fought Egyptian Spitfires; a 101 Squadron pilot claimed a victory (Supermarine Spitfire operational history)."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/Supermarine_Spitfire_operational_history', checked: '2026-10-11'}
  anchors:
  - place: Ekron (RAF Aqir)
    lon: 34.82184
    lat: 31.83947
    from: '1948-05-20'
    to: '1948-05-30'
    note: Formed here; it moved after its unassembled aircraft were strafed on 30 May.
    sources:
    - {url: 'https://en.wikipedia.org/wiki/101_Squadron_(Israel)', checked: '2026-10-11'}
    - {url: 'https://en.wikipedia.org/wiki/Tel_Nof_Airbase', checked: '2026-10-11'}
  - place: Herzliya strip
    lon: 34.83398
    lat: 32.18029
    from: '1948-05-30'
    to: '1948-10-01'
    precision: month
    note: "Its main base between June and October 1948 (en.wiki). Conflict: he.wiki puts Modi Alon's fatal approach to Herzliya on 16 October and the move to Hatzor in November; Eduard p. 54 dates the move to 21 November. The map follows en.wiki."
    sources:
    - {url: 'https://en.wikipedia.org/wiki/101_Squadron_(Israel)', checked: '2026-10-11'}
    - {url: 'https://he.wikipedia.org/wiki/%D7%98%D7%99%D7%99%D7%A1%D7%AA_101', checked: '2026-10-11'}
    - {url: 'https://en.wikipedia.org/wiki/Herzliya_Airport', checked: '2026-10-11'}
  - place: Hatzor
    lon: 34.72722
    lat: 31.7625
    from: '1948-10-01'
    to: '1949-07-20'
    precision: month
    note: Moved to Hatzor in October 1948 (en.wiki; Eduard p. 53 shows an S-199 at Hatzor in October 1948).
    sources:
    - {url: 'https://en.wikipedia.org/wiki/101_Squadron_(Israel)', checked: '2026-10-11'}
    - {url: 'https://info.eduard.com/en/11-2025-1/strana-53', checked: '2026-10-11'}
    - {url: 'https://en.wikipedia.org/wiki/Hatzor_Airbase', checked: '2026-10-11'}
