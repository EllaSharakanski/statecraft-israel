# The chapters of the game, in order. Eras are contiguous: each era's `from` is the previous era's `to`. A window is
# half-open, like every other window: `to` is the first day after the era. Reaching the last era's `to` ends the game.
# Design decision D3 (docs/superpowers/specs/2026-10-10-chapters-architecture-design.md): the founding era runs from
# the start of play to 1 January 1957, the spec's "Q2 1948 to Q4 1956". These are game-design dates, not historical facts.
# Optional per era: `systems: { legislature: state | assembly, map_actions: [transit_camp, housing] }` (issue #58). Absent means
# a state legislature and both map actions. A key is added only with the code behind it.
# `systems.loop: legacy | gdd` (GDD v0.1, docs/rules/mvp.md R-LOOP-001): which game loop runs; the same in every era. Absent
# means legacy. Since the GDD cutover (Phase 2 PR 1) the real game runs the GDD loop in every era; play ends at rules.yaml
# mvp.end (R-LOOP-004), before this era's end.
eras:
  - id: founding
    name: The Founding
    from: 1948-05-15               # = rules.yaml start
    to: 1957-01-01
    systems: { loop: gdd }
