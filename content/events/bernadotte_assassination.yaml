  # meeting; hundreds of Lehi members rounded up, 200 moved to Jaffa; a confession sent to the consulates by a group
  # signing itself the Fatherland Front, which the government called a Lehi splinter and a Lehi source said it had never
  # heard of; Bunche's note holding the Provisional Government responsible, and the government's reply.
  - { url: "https://www.jta.org/archive/israeli-government-outlaws-terrorist-groups-hundreds-of-sternists-rounded-up", checked: 2026-10-14 }
  # JTA, 21 September 1948: the ultimatum handed to the Irgun in Jerusalem "today"; an Irgun spokesman said it would
  # accept; the regulations, approved by the cabinet, signed "tonight" by Ben-Gurion.
  - { url: "https://www.jta.org/archive/irgun-accepts-govt-ultimatum-to-disband-israel-erects-detention-camp-for-terrorists", checked: 2026-10-14 }
