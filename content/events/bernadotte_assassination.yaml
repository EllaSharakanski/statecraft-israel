  # Provisional State Council, 19th sitting, 23 September 1948 (Knesset minutes). Ben-Gurion's statement: the murder of
  # Bernadotte and Colonel Serot in Jerusalem the previous Friday; inquiries pointed to Lehi, not the Irgun; arrests of
  # all Lehi men ordered, 184 arrested in Jerusalem and 62 in the Tel Aviv district without resistance; on the Saturday
  # night the government approved in principle emergency regulations against terrorist organisations, to be published in
  # the Official Gazette and brought to the council to become an ordinance; the ultimatum handed to the Irgun in Jerusalem on
  # the morning of Monday 20 September, 24 hours from 12:00, and the Irgun's acceptance. The council then adopted the
  # Prevention of Terrorism Ordinance by 34 votes. This is the government's account.
  - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_249987.pdf", checked: 2026-10-14 }
