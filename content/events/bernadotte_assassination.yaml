    historical: true
    recommended: true
    effects:
      - { target: intl_standing, delta: -0.05 }   # the killing itself, shared by both options (notes section 6)
      - { target: intl_standing, delta: 0.03 }    # partial recovery from the crackdown
      - { target: security, delta: 0.01 }
  - id: investigate_only
    # Game assumption: the notes name no advocate for this option.
    text: Investigate the killing without a general crackdown
    effects:
      - { target: intl_standing, delta: -0.05 }   # the killing itself, shared by both options (notes section 6)
      - { target: intl_standing, delta: -0.10 }
