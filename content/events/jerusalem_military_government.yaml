id: jerusalem_military_government
title: Jerusalem
text: 'Count Bernadotte has suggested demilitarising Jerusalem. The alternative is to declare the part of Jerusalem held by the IDF Israel-occupied territory, under a military governor, Dov Yosef. {prime_minister} must decide.'
