# yaml-language-server: $schema=../schema/event.schema.json
id: second_truce
title: The Second Truce
text: 'The Security Council has found a threat to the peace under Article 39 of the Charter and ordered a cease-fire within three days, and an immediate cease-fire in Jerusalem. {prime_minister} must decide whether Israel complies.'
anchor: hard
office: prime_minister
# Security Council Resolution 54, 15 July 1948 (S/902), 7-1 with 3 abstentions (the resolution as published by the UN).
# The truce took effect at 19:00 on 18 July (the IDF account; 1500 GMT in A/648) and lasted until 15 October (the IDF
# accounts and the Knesset's war summary date Operation Yoav from 15 October; S/1357 dates the Negev clash from
# 14 October). The date of Israel's acceptance is a gap in the notes. Research notes facts-1948.md section 5. The text
# does not mention Latrun: a player who chose the southern front never attacked it.
from: 1948-07-15
to: 1948-07-19
options:
  - id: comply
    text: Comply with the cease-fire
    historical: true
    recommended: true
    # Three months of truce: prolonged conflict (monthly turns) until the next offensive.
    set_rung: 4
    effects:
      - { target: intl_standing, delta: 0.03 }
  - id: defy
    # Game assumption: the notes name no advocate for defying the resolution.
    text: Defy the order and keep fighting
    effects:
      - { target: intl_standing, delta: -0.10 }
      - { target: security, delta: 0.01 }
sources:
  - { url: "https://avalon.law.yale.edu/20th_century/scres054.asp", checked: 2026-10-14 }
  # The UN's published text of resolution 54, with the vote: 7 to 1 (Syria), 3 abstentions.
  - { url: "https://documents.un.org/api/symbol/access?s=S/RES/54(1948)&l=en&t=pdf", checked: 2026-10-14 }
  - { url: "https://unispal.un.org/pdfs/AB14D4AAFC4E1BB985256204004F55FA.pdf", checked: 2026-10-14 }
  - { url: "https://www.un.org/unispal/document/auto-insert-210876/", checked: 2026-10-14 }
  # IDF accounts, republished by the Jewish Virtual Library: the second truce from 1900 hours on 18 July; Operation Yoav
  # launched after the convoy was fired on on 15 October.
  - { url: "https://jewishvirtuallibrary.org/jsource/History/truce2.html", checked: 2026-10-14 }
  - { url: "https://jewishvirtuallibrary.org/jsource/History/Yoav.html", checked: 2026-10-14 }
  # The Knesset's summary of the War of Independence: the truce took effect on 18 July; Yoav opened the road on
  # 15 October.
  - { url: "https://m.knesset.gov.il/About/Occasion/Documents/IndependenceWar.pdf", checked: 2026-10-14 }
status: fact-checked
