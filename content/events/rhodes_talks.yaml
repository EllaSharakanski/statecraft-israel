# yaml-language-server: $schema=../schema/event.schema.json
id: rhodes_talks
title: Talks at Rhodes
text: 'By 6 January Egypt and Israel had both accepted a cease-fire followed by direct talks under UN chairmanship, and the cease-fire took effect on 7 January. The talks are to open at Rhodes. {foreign_minister} must decide whether Israel sends a delegation.'
anchor: hard
tags: [security]
office: foreign_minister
# Bunche reported on 6 January 1949 (S/1187) that Egypt and Israel had notified their unconditional acceptance of a
# cease-fire followed by direct negotiations; the cease-fire took effect at 1200 GMT on 7 January (FRUS 1949 vol. VI
# doc. 362; the Rhodes cease-fire agreement of 24 January confirms the time, UNISPAL). The Rhodes talks opened on 13
# January 1949 (FRUS 1949 vol. VI doc. 389). The RAF clash of 7 January [C] (6 January on en.wiki "Operation Horev") is left out of the text. Research notes facts-1948.md section 9 (aftermath).
# Only a player who launched Operation Horev sees this card (the cease-fire it names ends that operation).
from: 1949-01-09
to: 1949-01-13
requires: { event: operation_horev, option: launch }
options:
  - id: send_delegation
    text: Send a delegation to Rhodes
    historical: true
    recommended: true
    effects:
      - { target: intl_standing, delta: 0.03 }
  - id: decline
    # Game assumption: no one is recorded arguing for this; its effect is a design value.
    text: Decline talks for now and keep the pressure on Egypt
    effects:
      - { target: intl_standing, delta: -0.05 }
sources:
  - { url: "https://en.wikipedia.org/wiki/Operation_Horev", checked: 2026-10-10 }
  - { url: "https://history.state.gov/historicaldocuments/frus1949v06/d362", checked: 2026-10-14 }
  - { url: "https://history.state.gov/historicaldocuments/frus1949v06/d389", checked: 2026-10-14 }
  - { url: "https://www.un.org/unispal/document/auto-insert-210639/", checked: 2026-10-14 }
  # Hansard, 11 May 1949: the British statement of 8 January 1949 dates the RAF clash to the morning of 7 January.
  - { url: "https://api.parliament.uk/historic-hansard/commons/1949/may/11/israel-attacked-british-aircraft", checked: 2026-10-14 }
status: fact-checked
