# yaml-language-server: $schema=../schema/event.schema.json
id: armistice_lebanon
title: Armistice with Lebanon
text: 'Negotiators have reached an armistice agreement with Lebanon. {prime_minister} must decide whether Israel signs.'
anchor: hard
office: prime_minister
from: 1949-03-23
# Hard anchor: fires on the first turn on or after `from`. `to` (exclusive, end of 1949) only makes the window finite,
# so the {prime_minister} placeholder needs a holder through 1949 and not past the holder's death (#1).
to: 1950-01-01
options:
  - id: sign
    text: Sign the armistice
    historical: true
    recommended: true
    set_rung: 2
    effects:
      - { target: intl_standing, delta: 0.05 }
  - id: hold_out
    text: Refuse and keep fighting
    set_rung: 4
    effects:
      - { target: intl_standing, delta: -0.10 }
sources:
  - { url: "https://avalon.law.yale.edu/20th_century/arm02.asp", checked: 2026-10-14 }
  - { url: "https://unispal.un.org/pdfs/71260B776D62FA6E852564420059C4FE.pdf", checked: 2026-10-14 }
status: fact-checked
